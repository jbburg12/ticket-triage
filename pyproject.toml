[project]
name = "ticket-triage"
version = "0.1.0"
description = "Triage customer support tickets with an LLM, plus an evaluation suite that keeps it honest."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "langfuse>=5.2.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
triage = "ticket_triage.cli:app"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
